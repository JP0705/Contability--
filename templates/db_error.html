{% extends "auth_base.html" %}

{% block title %}Indisponível{% endblock %}

{% block form %}
  <div class="alert alert-danger mb-3">
    O banco de dados está indisponível no momento. Verifique se o PostgreSQL está rodando
    (<code>docker compose up -d</code>) e tente novamente.
  </div>
  <a href="{{ request.path }}" class="btn btn-brand w-100 py-2">Tentar novamente</a>
{% endblock %}
