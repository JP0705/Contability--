{% extends "auth_base.html" %}

{% block title %}Criar conta{% endblock %}

{% block form %}
  <form method="post" novalidate>

    <label for="name" class="form-label">Nome</label>
    <input type="text" id="name" name="name" class="form-control mb-3"
           placeholder="Seu nome" value="{{ name or '' }}" maxlength="120" required autofocus>

    <label for="email" class="form-label">E-mail</label>
    <input type="email" id="email" name="email" class="form-control mb-3"
           placeholder="voce@empresa.com.br" value="{{ email or '' }}" required>

    <label for="password" class="form-label">Senha</label>
    <input type="password" id="password" name="password" class="form-control mb-3"
           placeholder="Mínimo de 8 caracteres" minlength="8" required>

    <label for="confirm" class="form-label">Confirmar senha</label>
    <input type="password" id="confirm" name="confirm" class="form-control mb-4"
           placeholder="Repita a senha" minlength="8" required>

    <button type="submit" class="btn btn-brand w-100 py-2">Criar conta</button>

  </form>

  <a href="{{ url_for('auth.login') }}" class="login-link">Já tenho conta. Entrar</a>
{% endblock %}
